name: buildSite
description: Builds the site to dist on ubuntu-26.04 runners, with the encoded images passed on from build to build in a cache, and without the Knots’ voice samples, so the browser’s own voice reads their titles
runs:
  using: composite
  steps:
  - name: setupBun
    uses: oven-sh/setup-bun@v2.2.0
    with:
      bun-version: 1.4.4
  - name: setupMediaTools
    uses: ./.github/actions/setupMediaTools
  - name: install
    shell: bash
    run: bun install --frozen-lockfile
  # The images cost seconds of encoding each, so every build passes on what it made to the next.
  - name: restoreImageCache
    id: restoreImageCache
    uses: actions/cache/restore@v6.1.0
    with:
      path: temp/vite-plugin-jxl
      key: jxl-${{ github.run_id }}
      restore-keys: jxl-
  - name: build
    shell: bash
    run: bun run build
  - name: saveImageCache
    if: steps.restoreImageCache.outputs.cache-matched-key != format('jxl-{0}', hashFiles('temp/vite-plugin-jxl/**'))
    uses: actions/cache/save@v6.1.0
    with:
      path: temp/vite-plugin-jxl
      key: jxl-${{ hashFiles('temp/vite-plugin-jxl/**') }}
