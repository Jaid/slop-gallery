name: ship
on:
  workflow_dispatch:
# A ship started while another one runs waits for it instead of cutting its deployment short.
concurrency:
  group: ship
  cancel-in-progress: false
jobs:
  ship:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # The head of the branch or tag picked for the run goes to slop.gallery.
    environment:
      name: production
      url: https://slop.gallery
    steps:
    - name: requireToken
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
          echo "::error::The repository secret CLOUDFLARE_API_TOKEN, a Cloudflare API token with Cloudflare Pages: Edit, is missing."
          exit 1
        fi
    - name: checkout
      uses: actions/checkout@v7.0.1
    - name: buildSite
      uses: ./.github/actions/buildSite
      with:
        openRouterApiKey: ${{ secrets.OPENROUTER_API_KEY }}
        voiceSamplesUrl: ${{ vars.VOICE_SAMPLES_URL }}
    # production is the Cloudflare project’s production branch, which no Git branch carries, so only this workflow deploys to slop.gallery.
    - name: deploy
      uses: cloudflare/wrangler-action@v4.1.3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: 94b07787e8a720b65196137d6224ec90
        packageManager: bun
        wranglerVersion: 4.157.0
        command: pages deploy dist --project-name=slop-gallery --branch=production --commit-dirty=false
