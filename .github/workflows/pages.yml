name: pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A newer push replaces the deployment of an older one still building.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    # Pull requests from forks get no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Only previews: main goes to main.slop-gallery.pages.dev and main-<8-character commit hash>.slop-gallery.pages.dev, a pull request to pr-<number>.slop-gallery.pages.dev and any other branch to <branch>.slop-gallery.pages.dev. The ship workflow puts a state on slop.gallery.
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    env:
      branch: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
    steps:
    - name: requireToken
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
          echo "::error::The repository secret CLOUDFLARE_API_TOKEN, a Cloudflare API token with Cloudflare Pages: Edit, is missing."
          exit 1
        fi
    # A pull request’s head, not its merge commit, so the preview shows what was pushed.
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: buildSite
      uses: ./.github/actions/buildSite
      with:
        openRouterApiKey: ${{ secrets.OPENROUTER_API_KEY }}
        voiceSamplesUrl: ${{ vars.VOICE_SAMPLES_URL }}
        allowSilence: true
    # The Cloudflare project’s production branch is named production, so a deployment to main is a preview too.
    - name: deploy
      id: deploy
      uses: cloudflare/wrangler-action@v4.1.3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: 94b07787e8a720b65196137d6224ec90
        packageManager: bun
        wranglerVersion: 4.157.0
        command: pages deploy dist --project-name=slop-gallery --branch=${{ env.branch }} --commit-dirty=false
    - name: shortenCommit
      id: shortenCommit
      if: env.branch == 'main'
      run: echo "hash=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
    # Keeps every state of main reachable after the next push replaces it on main.slop-gallery.pages.dev. The files are already uploaded, so this costs only the deployment itself.
    - name: deployCommit
      if: env.branch == 'main'
      uses: cloudflare/wrangler-action@v4.1.3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: 94b07787e8a720b65196137d6224ec90
        packageManager: bun
        wranglerVersion: 4.157.0
        command: pages deploy dist --project-name=slop-gallery --branch=main-${{ steps.shortenCommit.outputs.hash }} --commit-dirty=false
