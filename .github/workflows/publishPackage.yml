name: publishPackage
on:
  push:
    tags:
      - webgpu-capture-bridge-v*
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: 1.4.2
    - name: install
      run: bun install --frozen-lockfile
    - name: check
      run: bun run check
    - name: verifyRelease
      id: release
      working-directory: packages/webgpu-capture-bridge
      run: |
        bun --eval '
          const {name, version} = await Bun.file("package.json").json()
          if (Bun.env.GITHUB_REF_NAME !== name + "-v" + version) throw new Error("Release tag must match the capture package version.")
          const tag = version.includes("-") ? "next" : "latest"
          const file = Bun.file(Bun.env.GITHUB_OUTPUT)
          await Bun.write(file, await file.text() + "npm-tag=" + tag + "\n")
        '
    - name: publish
      working-directory: packages/webgpu-capture-bridge
      run: bun publish --tag ${{ steps.release.outputs.npm-tag }}
      env:
        NPM_CONFIG_TOKEN: ${{ secrets.npmToken }}
