name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
    - name: installFfmpeg
      run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
    - name: install
      run: bun install --frozen-lockfile
    - name: test
      run: bun run test
