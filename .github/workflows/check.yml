name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: 1.4.2
    - name: installSystemTools
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends ffmpeg libfuse2t64
        gh release download --repo ImageMagick/ImageMagick --pattern '*-gcc-x86_64.AppImage' --output "$RUNNER_TEMP/magick"
        sudo install --mode 755 "$RUNNER_TEMP/magick" /usr/local/bin/magick
        magick -version
        magick -list format | grep --ignore-case --extended-regexp "^ *(AVIF|JXL)"
    - name: install
      run: bun install --frozen-lockfile
    - name: check
      run: bun run check
