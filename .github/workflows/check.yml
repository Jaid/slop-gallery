name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: 1.4.4
    - name: setupMediaTools
      uses: ./.github/actions/setupMediaTools
    - name: install
      run: bun install --frozen-lockfile
    - name: check
      run: bun run check
