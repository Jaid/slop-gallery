name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: 1.4.2
    - name: installSystemPackages
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends ffmpeg build-essential pkg-config libjxl-dev libheif-dev libheif-plugin-aomenc libheif-plugin-dav1d libpng-dev libjpeg-dev liblcms2-dev zlib1g-dev
    # Prebuilt ImageMagick 7 packages (official AppImage, Homebrew) lack the JPEG XL delegate that vite-plugin-avif-only needs
    - name: cacheImageMagick
      id: cacheImageMagick
      uses: actions/cache@v4.3.0
      with:
        path: ~/imagemagick
        key: imagemagick-7.1.2-34-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}
    - name: buildImageMagick
      if: steps.cacheImageMagick.outputs.cache-hit != 'true'
      run: |
        git clone --quiet --depth 1 --branch 7.1.2-34 https://github.com/ImageMagick/ImageMagick.git "$RUNNER_TEMP/imagemagick"
        cd "$RUNNER_TEMP/imagemagick"
        ./configure --prefix="$HOME/imagemagick" --with-jxl --with-heic --without-x --without-perl --without-magick-plus-plus --disable-docs --disable-openmp
        make --jobs="$(nproc)"
        make install
    - name: setupImageMagick
      run: |
        echo "$HOME/imagemagick/bin" >> "$GITHUB_PATH"
        "$HOME/imagemagick/bin/magick" -list format | grep --extended-regexp "^ *(AVIF|JXL)"
    - name: install
      run: bun install --frozen-lockfile
    - name: check
      run: bun run check
