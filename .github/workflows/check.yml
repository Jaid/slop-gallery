name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: 1.4.2
    - name: installSystemTools
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends ffmpeg
        # Homebrew’s ImageMagick 7 comes with the JPEG XL delegate that apt’s and the official AppImage lack
        /home/linuxbrew/.linuxbrew/bin/brew install imagemagick
        echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
        export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
        magick -version
        magick -list format | grep --ignore-case --extended-regexp "^ *(AVIF|JXL)"
    - name: install
      run: bun install --frozen-lockfile
    - name: check
      run: bun run check
